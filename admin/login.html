<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login | Tearri Grundy</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p style="color:var(--ink-light);margin-bottom:24px;">Sign in to write a new post.</p>

    <div class="form-error" id="formError">Incorrect email or password. Try again.</div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-full">Log In</button>
    </form>

    <p style="margin-top:24px;"><a href="../index.html" style="font-size:0.85rem;color:var(--ink-light);">&larr; Back to the blog</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/data.js"></script>
<script src="../js/admin-login.js"></script>
</body>
</html>
